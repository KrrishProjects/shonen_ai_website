    .liquid-glass::before {

      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,

    .liquid-glass-strong {

    .liquid-glass-strong::before {

      inset: 0;
      border-radius: inherit;

    const HERO_VIDEO =

    function FadingVideo({ src, className = "", style = {} }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);
      const timeoutRef = useRef(null);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        function fadeTo(target, duration = FADE_MS) {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);

          const startOpacity = Number.parseFloat(video.style.opacity || "0") || 0;
          const start = performance.now();

          function step(now) {
            const progress = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const value = startOpacity + (target - startOpacity) * eased;
            video.style.opacity = String(value);

            if (progress < 1) {
              rafRef.current = requestAnimationFrame(step);
            }
          }

          rafRef.current = requestAnimationFrame(step);
        }

        function onLoadedData() {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1);
        }

        function onTimeUpdate() {
          if (!video.duration || Number.isNaN(video.duration)) return;

          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0);
          }
        }

        function onEnded() {
          video.style.opacity = "0";
          timeoutRef.current = setTimeout(() => {
            try {
              video.currentTime = 0;
              fadingOutRef.current = false;
              video.play().catch(() => {});
              fadeTo(1);
            } catch (e) {}
          }, 100);
        }

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);

        if (video.readyState >= 2) onLoadedData();

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (timeoutRef.current) clearTimeout(timeoutRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          muted
          autoPlay
          playsInline
          preload="auto"
          className={className}
          style={{ opacity: 0, ...style }}
        />
      );
    }

    function BlurText({ text, className = "" }) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;

        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );

        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p ref={ref} className={className} style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
          {words.map((word, i) => (
            <motion.span
              key={`${word}-${i}`}
              style={{ display: "inline-block", marginRight: "0.28em" }}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={visible ? {
                filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                opacity: [0, 0.5, 1],
                y: [50, -5, 0],
              } : {}}
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: "easeOut",
                delay: i * 0.1,
              }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    }

    function LogoMark({ large = false }) {

    const fadeUp = {

                transition={{ delay: 0.4, ease: "easeOut", duration: 0.75 }}

                </div>
              </motion.div>

            <motion.div

                Built with modern app technology and secure backend systems

              <div className="flex flex-wrap justify-center gap-8 md:gap-14 font-heading italic text-white text-2xl md:text-3xl tracking-tight">
                <span>Flutter</span>
                <span>Firebase</span>
                <span>Render</span>
                <span>GitHub</span>

              </div>
            </motion.div>
          </div>
        </section>
      );
    }

    const ICONS = {
      tools: "M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z",

    window.FadingVideo = FadingVideo;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
